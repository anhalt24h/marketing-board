name: daily-board

on:
  schedule:
    - cron: "7 18 * * *"  # 매일 03:07 KST (실제로는 3시간 반쯤 밀려 6:30~7시에 돎. 10시 댓글 루틴 전에 끝나도록 새벽으로 당김)
  workflow_dispatch:      # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 보드 생성
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          BOARD_READ_KEY: ${{ secrets.BOARD_READ_KEY }}
        run: python "마케팅 과업보드/generate_board.py"
      - name: 결과 저장 (GitHub Pages 자동 반영)
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add docs "마케팅 과업보드"/{seen_videos,view_history,done_videos}.json
          git diff --cached --quiet || git commit -m "보드 갱신 $(TZ=Asia/Seoul date +%F)"
          git push

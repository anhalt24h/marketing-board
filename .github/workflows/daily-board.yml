name: daily-board

on:
  schedule:
    - cron: "0 0 * * *"  # 매일 09:00 KST (GitHub 사정으로 몇 분~수십 분 늦어질 수 있음)
  workflow_dispatch:      # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 보드 생성
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python generate_board.py
      - name: 결과 저장 (GitHub Pages 자동 반영)
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add docs seen_videos.json view_history.json
          git diff --cached --quiet || git commit -m "보드 갱신 $(TZ=Asia/Seoul date +%F)"
          git push

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 마케팅 과업</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e4e2dc; --grid:#ecebe6;
  --accent:#2a78d6; --yt:#e5322d; --kin:#03a94f; --th:#111111; --chip:#f0eee9;
  --p-manager:#2a78d6; --p-member:#eb6834;   /* 사람별 색 (색약 검증 통과 조합) */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141416; --card:#1e1e21; --ink:#ececef; --muted:#9c9ca3; --line:#2e2e33; --grid:#29292d;
    --accent:#3987e5; --yt:#ff5a55; --kin:#2fd27a; --th:#f2f2f2; --chip:#27272b;
    --p-manager:#3987e5; --p-member:#d95926;
  }
}
:root[data-theme="dark"]{
  --bg:#141416; --card:#1e1e21; --ink:#ececef; --muted:#9c9ca3; --line:#2e2e33; --grid:#29292d;
  --accent:#3987e5; --yt:#ff5a55; --kin:#2fd27a; --th:#f2f2f2; --chip:#27272b;
  --p-manager:#3987e5; --p-member:#d95926;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
.date{color:var(--muted);font-size:14px;margin-top:2px}
.role{display:inline-block;margin-left:8px;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--muted);vertical-align:middle}
.live{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--kin)}
.live.off i{background:var(--muted)}
.notice{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.notice.fb{border-left-color:var(--p-member)}
.notice .when{color:var(--muted);font-size:12px;margin-right:6px}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}
.pdot.manager{background:var(--p-manager)} .pdot.member{background:var(--p-member)}

section.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:20px}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sec-head h2{margin:0;font-size:18px}
.sec-head .hint{font-size:12px;color:var(--muted)}

/* 실시간 현황 */
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.ptile{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ptile .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ptile .name{font-weight:700}
.ptile .pct{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.ptile .pct small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.catrow{display:grid;grid-template-columns:52px 1fr 54px;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.track{height:8px;border-radius:99px;background:var(--grid);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width .3s}
.track.manager i{background:var(--p-manager)} .track.member i{background:var(--p-member)}
.catrow b{color:var(--ink);font-weight:600;text-align:right}
.worktime{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.worktime b{color:var(--ink);font-weight:600}
.chartbox{position:relative;margin-top:16px}
.chartbox h3{margin:0 0 6px;font-size:14px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:4px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-size:11px;fill:var(--muted)}
.chart .lbl{font-size:12px;font-weight:600;fill:var(--ink)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5}
.tip.on{opacity:1}
.timeline{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.timeline th,.timeline td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.timeline th{font-size:12px;color:var(--muted);font-weight:500}
.timeline td.t{white-space:nowrap;font-variant-numeric:tabular-nums}
.timeline td.tk{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timeline-wrap{max-height:320px;overflow:auto}

/* 과업 카드 */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.task h2{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%}
.task .meta{color:var(--muted);font-size:13px}
.task .count{font-size:24px;font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:9px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.unit-row{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.unit-row .uhead{display:flex;align-items:center;gap:8px;font-size:13px}
.unit-row .uhead .cnt{margin-left:auto;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{appearance:none;border:0;background:var(--chip);color:var(--ink);width:26px;height:24px;font-size:15px;cursor:pointer}
.stepper span{min-width:34px;text-align:center;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:8px;min-width:48px;padding:5px 8px;font:inherit;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip:disabled{cursor:default}
.chip.done.manager{background:var(--p-manager);border-color:var(--p-manager);color:#fff}
.chip.done.member{background:var(--p-member);border-color:var(--p-member);color:#fff}
.chip:not(:disabled):hover{border-color:var(--ink)}
.empty{color:var(--muted);font-size:13px}

/* 유튜브 */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters .btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{margin-top:18px}
.group-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:10px}
.group-head h3{margin:0;font-size:15px}
.kind{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.group-head .right{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.group-head .right a{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.vid{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:var(--card)}
.vid.mine-member{border-color:var(--p-member)}
.vid a.thumb{position:relative;display:block;aspect-ratio:16/9;background:var(--chip)}
.vid img{width:100%;height:100%;object-fit:cover;display:block}
.vid .len{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;padding:1px 5px;border-radius:4px}
.vid .body{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.vid .title{font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid .sub{font-size:12px;color:var(--muted)}
.vid .foot{margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.check input:disabled{cursor:not-allowed}
.check .at{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
/* 영상 요약 · 댓글안 (접근 키로 열었을 때만, 10시 루틴이 채움) */
.ytc{font-size:12.5px}
.ytc.wait{color:var(--muted);font-size:12px}
.ytc details{border:1px solid var(--line);border-radius:9px;background:var(--chip)}
.ytc summary{cursor:pointer;padding:6px 9px;font-weight:600;list-style:none}
.ytc summary::-webkit-details-marker{display:none}
.ytc summary::after{content:" ▾";color:var(--muted)}
.ytc details[open] summary::after{content:" ▴"}
.ytc .in{padding:0 9px 9px;display:flex;flex-direction:column;gap:8px}
.ytc .lbl{font-size:11px;color:var(--muted);margin-bottom:2px}
.ytc .txt{white-space:pre-line;line-height:1.5;color:var(--ink)}
.ytc .cmt{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px}
.ytc .cmt-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.ytc .pick{background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:4px;padding:0 2px}
.ytc .opts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ytc .opt{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:99px;padding:2px 9px;font:inherit;font-size:11.5px;cursor:pointer}
.ytc .opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vid.done{opacity:.45}
.vid.done .title{text-decoration:line-through}
.who{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--muted);border-radius:99px;padding:1px 9px;font:inherit;font-size:11.5px;cursor:default}
.who.member{background:var(--p-member);border-color:var(--p-member);color:#fff}
.manager-view .who{cursor:pointer}
.group.hot{background:color-mix(in srgb,var(--yt) 7%,transparent);border:1px solid color-mix(in srgb,var(--yt) 35%,transparent);border-radius:12px;padding:14px;margin-top:14px}
.kind.hot{background:var(--yt);color:#fff}
.rate{display:inline-block;font-size:11.5px;font-weight:700;color:var(--yt)}
.rank{position:absolute;left:6px;top:6px;background:var(--yt);color:#fff;font-size:12px;font-weight:700;padding:1px 7px;border-radius:6px}

/* 공지 · 피드백 */
.notes{display:flex;flex-direction:column;gap:6px}
.notes:empty{display:none}
.note{display:flex;align-items:flex-start;gap:8px;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.note .k{flex:none;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-top:1px}
.note .k.notice{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.note .k.feedback{background:color-mix(in srgb,var(--yt) 13%,transparent);color:var(--yt)}
.note .txt{flex:1;white-space:pre-wrap;word-break:break-word}
.note .to{flex:none;font-size:11px;color:var(--muted)}
.note .x{flex:none;appearance:none;border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
.note-form{display:none;flex-wrap:wrap;gap:6px;align-items:center}
.note-form.open{display:flex}
.note-form select,.note-form input{border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;padding:5px 7px}
.note-form input{flex:1;min-width:160px}
.add-note{align-self:flex-start}
#common-box .notes{margin-top:2px}

/* 기록 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 14px}
.stat{background:var(--chip);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.fb-form{display:flex;gap:8px;margin:0 0 14px}
.fb-form textarea{flex:1;min-height:60px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.tablewrap{overflow-x:auto;margin-top:14px}
.logtable{width:100%;border-collapse:collapse;font-size:13px}
.logtable th,.logtable td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:top}
.logtable th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
.logtable td:first-child,.logtable th:first-child{text-align:left;white-space:nowrap}
.logtable td.fbcell{text-align:left;min-width:180px}
.logtable .sub{color:var(--muted);font-size:12px}
.daybtn{appearance:none;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;padding:0;text-align:left}
.daybtn:hover,.daybtn.on{color:var(--accent);text-decoration:underline}
#day-detail{margin-top:14px}
#day-detail:empty{display:none}
.detail-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:6px}
.detail-head h3{margin:0;font-size:15px}
.detail-head span{font-size:12.5px;color:var(--muted)}
@media (max-width:900px){.summary{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.grid{grid-template-columns:1fr}h1{font-size:22px}.timeline td.tk{max-width:150px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>오늘의 마케팅 과업<span class="role" id="role"></span></h1>
      <div class="date" id="date"></div>
    </div>
    <div class="live off" id="live"><i></i><span>연결 전</span></div>
  </header>

  <section class="box" id="common-box">
    <div class="sec-head"><h2>📌 공지 · 피드백</h2><span class="hint">모든 과업에 공통으로 참고할 내용</span></div>
    <div class="notes" id="notes-common"></div>
    <div class="empty" id="notes-common-empty">등록된 공통 공지가 없어요.</div>
  </section>

  <div id="notices"></div>

  <section class="box" id="dash">
    <div class="sec-head"><h2>실시간 현황</h2><span class="hint">30초마다 자동 갱신 · 체크한 시각으로 소요시간 계산</span></div>
    <div class="people" id="people"></div>
    <div class="chartbox chart" id="cum-box">
      <h3>오늘 누적 완료 건수</h3>
      <div class="legend" id="cum-legend"></div>
      <div id="cum-chart"></div>
      <div class="tip" id="cum-tip"></div>
    </div>
    <div class="chartbox">
      <h3>작업 타임라인</h3>
      <div class="timeline-wrap"><table class="timeline" id="timeline"></table></div>
    </div>
  </section>

  <div class="summary">
    <div class="task" id="t-yt">
      <h2><span class="dot" style="background:var(--yt)"></span>유튜브 댓글</h2>
      <div class="count" id="yt-count">0 / 0</div>
      <div class="meta" id="yt-meta">아래 영상에 들어가서 댓글 달고 체크하기</div>
      <div class="notes" id="notes-yt"></div>
      <div class="btns"><a class="btn primary" href="#videos">영상 목록 보기 ↓</a></div>
    </div>
    <div class="task" id="t-kin">
      <h2><span class="dot" style="background:var(--kin)"></span>네이버 지식인</h2>
      <div class="meta">답변 1건 끝낼 때마다 칸을 하나씩 체크</div>
      <div class="notes" id="notes-kin"></div>
      <div id="units-kin"></div>
      <div class="btns">
        <a class="btn primary" id="kin-link" target="_blank" rel="noopener">지식인 열기</a>
        <a class="btn" id="kin-search" target="_blank" rel="noopener">"<span id="kin-q"></span>" 최신순</a>
      </div>
    </div>
    <div class="task" id="t-th">
      <h2><span class="dot" style="background:var(--th)"></span>스레드</h2>
      <div class="meta">게시 1건 끝낼 때마다 칸을 하나씩 체크</div>
      <div class="notes" id="notes-threads"></div>
      <div id="units-threads"></div>
      <div class="btns">
        <button class="btn primary" id="th-both">두 창 모두 열기</button>
        <a class="btn" id="th-link" target="_blank" rel="noopener">스레드</a>
        <a class="btn" id="sheet-link" target="_blank" rel="noopener">시트</a>
      </div>
    </div>
  </div>

  <section class="box" id="videos">
    <div class="sec-head">
      <h2>유튜브 댓글 대상 영상</h2>
      <div class="filters" id="filters"></div>
    </div>
    <div class="notes" id="notes-yt2"></div>
    <div id="groups"></div>
  </section>

  <section class="box" id="log">
    <div class="sec-head"><h2>업무 수행 기록</h2></div>
    <div id="fb-area"></div>
    <div id="log-body" class="empty">기록을 불러오는 중…</div>
  </section>

<script>

escription": "🔥 누워서 골반을 바로잡고 아랫배와 승마살을\n싹 지워버리는 하체·코어 리셋 4단계 팩트!\n\n장쌤의 누워서 하는 골반 정렬 & 코어 버닝 가이드\n\n허리가 아프거나,\n골반이 앞으로 쏠려 아랫배가 볼록 튀어나오고,\n허벅지 안팎으로 군살이 낄 때\n\n바닥에 누워 수행하는 이 4가지 동작은\n몸의 중심축을 바로잡는\n가장 안전하고 강력한 열쇠입니다.\n\n오늘 알려드리는 누워서 하는 4가지 타겟 테크닉이\n왜 골반 정렬, 아랫배 소멸, 복압 조절, 승마살 완화에\n놀라운 변화를 만들어내는지\n그 해부학적 팩트를 파헤쳐 드립니다.\n\nLet's go~!! ❤️\n\n1️⃣ 하늘 보고 누워 나비자세\n(틀어진 골반 전방경사 교정 & 안벅지 타겟, 100회)\n\n하늘을 보고 누운 상태에서\n발바닥을 서로 맞붙여\n무릎을 바깥쪽으로 벌려 나비 모양을 만든 뒤,\n골반의 정렬을 유지하며\n무릎을 가볍게 여닫거나\n이완 상태를 유지하는 동작입니다.\n\n이 동작이 틀어진 골반(전방경사)을 제자리로 돌리고\n허벅지 안쪽살을 빼주는 이유는\n\n골반 주변에 뭉쳐 있던 고관절의 긴장을 부드럽게 풀어주는 동시에,\n고관절 외회전근을 깨우고\n허벅지 안쪽의 내전근 군단을 길게 늘려주어\n골반의 중립 정렬(Neutral Pelvis)을\n되찾아 주기 때문입니다!\n\n평소에 굳어 있던\n서고 걷는 자세의 불균형을 바로잡고,\n안벅지 깊은 곳의 순환을 촉진해\n출렁이는 안벅지 살을 매끄럽게 정돈해 줍니다.\n\n2️⃣ 누워서 토터치\n(볼록 튀어나온 아랫배 소멸 타겟, 100회)\n\n하늘을 보고 누워\n두 손으로 바닥을 가볍게 지지한 상태에서,\n허리가 바닥에서 뜨지 않도록\n복부에 단단히 힘을 주고\n다리를 들어 올린 뒤\n발끝으로 바닥을 가볍게 터치하고 돌아오는 동작입니다.\n\n이 동작이 볼록 튀어나온 아랫배를\n납작하게 만들어 주는 이유는\n\n다리의 무게를 하복부의 힘으로 버텨내며\n골반이 앞쪽으로 들리는 것을 억제할 때,\n복부 전면의 복직근 하부와 심부 복횡근이\n강력한 등척성·단축성 수축을 일으키기 때문입니다!\n\n중력에 의해 아래로 처져 있던\n내장과 하복부의 늘어진 장력을\n위로 바짝 끌어올려 주어\n불룩했던 아랫배를 납작하고 단단하게 만들어 줍니다.\n\n3️⃣ 리버스 크런치\n(복압 조절 개선 & 복직근 이개 완화 타겟, 30회)\n\n하늘을 보고 누운 상태에서\n골반을 가슴 쪽으로 말아 올리듯\n하체를 들어 올려주는\n리버스 크런치 동작입니다.\n\n이 동작이 복압 조절 능력을 개선하고\n복직근 이개 증상에 도움을 주는 이유는\n\n골반을 후방으로 회전시키며\n하복부를 수축할 때,\n코어를 360도로 감싸며 복부 압력을 조율하는\n복횡근과 골반저근의 협응력이\n극대화되기 때문입니다!\n\n출산이나 복부 압력 과부하로 인해\n좌우로 벌어졌던 복직근(Rectus abdominis)의\n중앙선 간격을 안쪽으로 모아주는 장력을 회복시켜 주어,\n무너진 복압 시스템을\n건강하게 재정렬해 줍니다.\n\n단, 출산 직후이거나 복직근 이개가 심한 경우\n동작 중 배 가운데가 불룩 솟아오른다면\n무리하지 말고 전문가와 상의 후 진행해 주세요!\n\n4️⃣ 무릎 붙이고 윈드 쉴드 와이퍼\n(허리 통증 완화 & 승마살 타겟, 30회)\n\n하늘을 보고 누워\n무릎을 붙이고 구부린 채\n발을 땅에 단단히 고정한 상태에서,\n자동차 와이퍼처럼\n무릎을 좌우 양옆으로 부드럽게 쓰러뜨리며\n회전시키는 동작입니다.\n\n이 동작이 허리 통증을 줄여주고\n승마살을 완화해 주는 이유는\n\n골반과 요추의 회전(Rotation)을 유도하면서\n척추를 지탱하는 요방형근, 척주기립근,\n그리고 고관절 외회전근과\n대퇴근막장근(승마살 유발 부위)의 유착을\n부드럽게 풀어주기 때문입니다!\n\n허리 주변의 고질적인 긴장과 통증을 해소하고,\n골반 외측에 툭 튀어나와 있던\n승마살 라인의 림프 순환을 열어주어\n매끄러운 하체 실루엣을 완성해 줍니다.\n\n💡 장쌤의 한 마디\n\n아랫배와 골반의 틀어짐은\n억지로 힘을 const dur = ms => { if (ms == null) return "—"; const m = Math.round(ms / 60000); return m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간 ${m % 60}분`; };

// ── 접근 키: 링크의 #k=... 를 기기에 기억 (홈 화면에 추가해도 유지)
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
};
const hashKey = new URLSearchParams(location.hash.slice(1)).get("k");
if (hashKey) { store.set("board-key", hashKey); history.replaceState(null, "", location.pathname); }
const ACCESS = hashKey || store.get("board-key");
const ONLINE = !!(DATA.api_url && ACCESS);
addEventListener("hashchange", () => location.reload());  // 다른 접근 링크를 같은 탭에 붙여넣은 경우

let role = ONLINE ? null : "manager";  // 서버 응답으로 확정
let items = {};      // 항목키 → {assignee, done, doneBy, doneAt}
let feedback = [], logRows = [];
let quotas = {kin: {manager: 1, member: 0}, threads: {manager: 1, member: 0}};
let notices = [];
let ytNotes = {};    // 영상ID → {summary, flow, comments[]}
let pending = 0, lastSync = null;
const me = () => role === "member" ? "member" : "manager";
const visiblePeople = () => !ONLINE ? ["manager"] : role === "manager" ? PEOPLE : ["member"];

// ── 오늘의 항목: 유튜브 영상 + 지식인/스레드 할당량만큼의 칸 (kin:member:3 등)

const VIDEOS = [];
DATA.groups.forEach(g => g.videos.forEach(v => VIDEOS.push({key: "yt:" + v.id, label: v.title, cat: "yt"})));
function buildItems() {
  ITEMS = [...VIDEOS];
  for (const cat of ["kin", "threads"]) for (const p of PEOPLE)
    for (let n = 1; n <= (quotas[cat][p] || 0); n++)
      ITEMS.push({key: `${cat}:${p}:${n}`, label: `${CATS[cat]} #${n}`, cat, owner: p});
  ITEM = Object.fromEntries(ITEMS.map(i => [i.key, i]));
}
const ownerOf = key => (/^(?:kin|threads|start):(manager|member)\b/.exec(key) || [])[1];
const assignee = key => ownerOf(key) || items[key]?.assignee || "manager";
const isDone = key => !!items[key]?.done;
buildItems();

$("kin-q").textContent = DATA.kin_query;
$("kin-link").href = DATA.kin_url;
$("kin-search").href = DATA.kin_search_url;

const rateText = v => v.rate > 0 ? `하루 +${fmt(v.rate)}회${v.rate_kind === "measured" ? " (실측)" : ""}` : "";

          <div class="foot">

  </div>`).join("");
const boxes = [...document.querySelectorAll("input[data-key]")];

// ── 서버 통신 (Apps Script). text/plain 으로 보내 CORS 사전요청을 피한다
function applyServer(res) {
  if (!res || res.error) { showNotice("서버 오류: " + (res?.error || "응답 없음")); return; }
  role = res.role; items = res.items || {}; feedback = res.feedback || []; logRows = res.log || [];
  if (res.quotas) quotas = res.quotas;
  if (res.notices) notices = res.notices;
  if (res.ytNotes) ytNotes = res.ytNotes;
  lastSync = Date.now();
  buildItems();
  render();
}
function post(body) {
  if (!ONLINE) { store.set("local-" + DATA.date, JSON.stringify({items, quotas})); return; }
  pending++;
  fetch(DATA.api_url, {method: "POST", body: JSON.stringify({k: ACCESS, date: DATA.date, ...ownRecords(), ...body})})
    .then(r => r.json()).then(res => { pending--; if (!pending) applyServer(res); })
    .catch(() => { pending--; showNotice("저장에 실패했어요. 인터넷 연결을 확인하고 새로고침해 주세요."); });
}
function poll() {
  if (!ONLINE || pending || document.hidden) return;
  fetch(`${DATA.api_url}?k=${encodeURIComponent(ACCESS)}&date=${DATA.date}`)
    .then(r => r.json()).then(res => { if (!pending) applyServer(res); })
    .catch(() => { $("live").className = "live off"; $("live").lastElementChild.textContent = "연결 끊김 · 재시도 중"; });
}

const canCheck = key => !ONLINE || role === "manager" || assignee(key) === "member";
function setDone(key, done, label, cat) {
  const it = ITEM[key] || {key, label, cat};
  items[key] = {...(items[key] || {assignee: assignee(key)}), done, doneBy: role, doneAt: done ? new Date().toISOString() : ""};
  render();
  post({action: "check", item: {key, label: it.label, cat: it.cat}, done});
}
function setAssignee(keys, who) {
  keys.forEach(k => { items[k] = {...(items[k] || {}), assignee: who}; });
  render();
  post({action: "assign", items: keys.map(k => ITEM[k]), assignee: who});
}
function setQuota(cat, person, n) {
  n = Math.max(0, Math.min(50, n));
  quotas = {...quotas, [cat]: {...quotas[cat], [person]: n}};
  buildItems();
  render();
  post({action: "quota", cat, person, n});
}

boxes.forEach(b => b.onchange = () => setDone(b.dataset.key, b.checked));
document.addEventListener("click", e => {
  const who = e.target.closest("[data-who]");
  if (who && role === "manager" && ONLINE) {
    const k = who.dataset.who;
    return setAssignee([k], assignee(k) === "member" ? "manager" : "member");
  }
  const grp = e.target.closest("[data-assign-group]");
  if (grp) {
    const keys = DATA.groups[+grp.dataset.assignGroup].videos.map(v => "yt:" + v.id);
    return setAssignee(keys, keys.every(k => assignee(k) === "member") ? "manager" : "member");
  }
  const unit = e.target.closest("[data-unit]");
  if (unit && !unit.disabled) return setDone(unit.dataset.unit, !isDone(unit.dataset.unit));
  const q = e.target.closest("[data-quota]");
  if (q) { const [cat, p, delta] = q.dataset.quota.split(":"); return setQuota(cat, p, (quotas[cat][p] || 0) + +delta); }
  const st = e.target.closest("[data-start]");
  if (st && !st.disabled) return setDone("start:" + st.dataset.start, true, "업무 시작", "start");
});

// ── 수행율 · 시간 계산
// 수행율: 유튜브 50 / 지식인 25 / 스레드 25, 그 사람에게 할당된 분류만으로 다시 비율 계산
function catStats(p) {
  const out = {};
  for (const cat of Object.keys(CATS)) {
    const list = ITEMS.filter(i => i.cat === cat && assignee(i.key) === p);
    out[cat] = {total: list.length, done: list.filter(i => isDone(i.key)).length};
  }
  return out;
}
function timeline(p) {
  const s = items["start:" + p];
  const start = s?.done ? T(s.doneAt) : null;
  const events = ITEMS.filter(i => assignee(i.key) === p && isDone(i.key) && items[i.key]?.doneAt)
    .map(i => ({...i, p, t: T(items[i.key].doneAt)})).sort((a, b) => a.t - b.t);
  let prev = start, work = 0, counted = 0;
  for (const e of events) {
    const gap = prev != null ? e.t - prev : null;
    e.from = prev;
    e.brk = gap != null && gap > BREAK_MS;
    e.dur = gap != null && gap >= 0 && !e.brk ? gap : null;
    if (e.dur != null) { work += e.dur; counted++; }
    prev = e.t;
  }
  return {start, first: start ?? events[0]?.t ?? null, last: events.at(-1)?.t ?? null, events, work: counted ? work : null, counted};
}
function personStats(p) {
  const cs = catStats(p);
  let w = 0, score = 0, assigned = 0, done = 0;
  for (const cat of Object.keys(cs)) {
    assigned += cs[cat].total; done += cs[cat].done;
    if (!cs[cat].total) continue;
    w += WEIGHT[cat]; score += WEIGHT[cat] * cs[cat].done / cs[cat].total;
  }
  const tl = timeline(p);
  return {person: p, assigned, done, pct: w ? Math.round(score / w * 100) : null,
    start: tl.first ? new Date(tl.first).toISOString() : null, end: tl.last ? new Date(tl.last).toISOString() : null,
    workMin: tl.work == null ? null : Math.round(tl.work / 60000)};
}
// 시트 worklog 탭에 남길 과업별 소요시간 (업무 시작 1줄 + 완료한 과업마다 1줄)
function worklogRows() {
  const iso = t => t == null ? null : new Date(t).toISOString();
  return PEOPLE.flatMap(p => {
    const tl = timeline(p);
    const rows = tl.start ? [{person: p, cat: "start", label: "업무 시작", from: null, at: iso(tl.start), min: null, note: ""}] : [];
    return rows.concat(tl.events.map(e => ({person: p, cat: e.cat, label: e.label, from: iso(e.from), at: iso(e.t),
      min: e.dur == null ? null : Math.round(e.dur / 6000) / 10, note: e.brk ? "휴식 후 (소요시간 제외)" : e.from == null ? "업무 시작 전 체크" : ""})));
  });
}

// 서버에 보낼 기록: 팀원은 본인 것만 (팀장 과업은 받지도 않음), 팀장은 할당을 바꾸므로 수행율은 둘 다
function ownRecords() {
  const mine = me();
  return {summary: role === "manager" ? summaries() : summaries().filter(s => s.person === mine),
    worklog: worklogRows().filter(r => r.person === mine)};
}

// 할당이 0개가 된 사람도 보내서 시트의 이전 값을 덮어쓴다 (pct = null → "할당 없음")
const summaries = () => PEOPLE.map(personStats);

function showNotice(msg) {
  $("notices").insertAdjacentHTML("afterbegin", `<div class="notice">${esc(msg)}</div>`);
}

// ── 화면 그리기
function render() {
  const mgr = role === "manager";
  document.body.classList.toggle("manager-view", mgr && ONLINE);
  $("role").textContent = !ONLINE ? "개인 모드" : !role ? "불러오는 중" : mgr ? `${NAMES.manager} 보기` : `${NAMES.member} 보기`;
  if (ONLINE && lastSync) { $("live").className = "live"; $("live").lastElementChild.textContent = `실시간 · ${new Date(lastSync).toLocaleTimeString("ko-KR", {hour12: false})} 갱신`; }
  if (!ONLINE) { $("live").className = "live off"; $("live").lastElementChild.textContent = "개인 모드 (이 기기에만 저장)"; }

  renderFilters();
  renderVideos();
  renderUnits();
  renderPeople();
  renderCumChart();
  renderTimeline();
  renderNotes();
  renderNotices();
  renderLog();
}

function renderFilters() {
  const mgr = role === "manager";
  const opts = !ONLINE ? [["all", "전체"], ["todo", "남은 것"], ["done", "완료"]]
    : mgr ? [["all", "전체"], ["member", `${NAMES.member} 할당`], ["todo", "남은 것"], ["done", "완료"]]
    : [["mine", "내 과업"], ["todo", "남은 것"], ["done", "완료"]];
  if (filterRole !== role || !opts.some(o => o[0] === filter)) { filter = opts[0][0]; filterRole = role; }
  $("filters").innerHTML = opts.map(([f, t]) => `<button class="btn${f === filter ? " on" : ""}" data-f="${f}">${t}</button>`).join("");
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });
}

function renderVideos() {
  const mgr = role === "manager";
  document.querySelectorAll("[data-who]").forEach(b => {
    const a = assignee(b.dataset.who);
    b.textContent = NAMES[a];
    b.style.display = ONLINE ? "" : "none";
    b.classList.toggle("member", a === "member");
    b.title = mgr ? "눌러서 담당 바꾸기" : "";
  });
  boxes.forEach(b => {
    b.checked = isDone(b.dataset.key);
    b.disabled = ONLINE && (!role || !canCheck(b.dataset.key));

  });
  document.querySelectorAll(".mgr-only").forEach(b => b.style.display = mgr && ONLINE ? "" : "none");
  document.querySelectorAll("[data-assign-group]").forEach(b => {

    const show = allowed && (filter === "all" || (filter === "done" && done) || (filter === "todo" && !done)
      || ((filter === "member" || filter === "mine") && a === "member"));
    el.style.display = show ? "" : "none";
  });
  document.querySelectorAll(".group").forEach(g => {
    const cards = [...g.querySelectorAll(".vid")];
    g.style.display = cards.length && cards.every(c => c.style.display === "none") ? "none" : "";

  $("yt-count").textContent = `${yt.filter(i => isDone(i.key)).length} / ${yt.length}`;
  $("yt-meta").textContent = mine ? `${NAMES.member}님에게 할당된 영상` : "아래 영상에 들어가서 댓글 달고 체크하기";
}

// 영상 카드 안 요약 · 댓글안. 내용이 바뀔 때만 다시 그려서 펼쳐 둔 칸이 닫히지 않게 한다
// 댓글안의 [보기1 / 보기2 / 보기3]은 고르는 칸이다. 고른 보기로 완성된 문장을 보여 주고 그대로 복사한다
const cmtParts = c => c.split(/(\[[^\]]*\/[^\]]*\])/).filter(Boolean)
  .map(s => /^\[.*\]$/.test(s) ? s.slice(1, -1).split("/").map(o => o.trim()).filter(Boolean) : s);
const cmtPicks = {};
const cmtText = (vid, i, c) => cmtParts(c).map((p, g) => typeof p === "string" ? p : p[(cmtPicks[vid + ":" + i] || {})[g] || 0]).join("");
function cmtHtml(vid, i, c) {
  const pk = cmtPicks[vid + ":" + i] || {};
  const parts = cmtParts(c);
  const out = parts.map((p, g) => typeof p === "string" ? esc(p) : `<span class="pick">${esc(p[pk[g] || 0])}</span>`).join("");
  const opts = parts.map((p, g) => typeof p === "string" ? "" : `<div class="opts">${p.map((o, k) =>
    `<button class="opt${(pk[g] || 0) === k ? " on" : ""}" data-pick="${i}:${g}:${k}">${esc(o)}</button>`).join("")}</div>`).join("");
  return `<div class="txt">${out}</div>${opts}`;
}
function renderYtNotes() {
  document.querySelectorAll("[data-ytc]").forEach(el => {
    const n = ONLINE ? ytNotes[el.dataset.ytc] : null;
    const sig = n ? JSON.stringify(n) : ONLINE && role ? "wait" : "";
    if (el.dataset.sig === sig) return;
    el.dataset.sig = sig;
    el.className = "ytc" + (sig === "wait" ? " wait" : "");
    el.innerHTML = !n ? (sig === "wait" ? "📝 댓글안 준비 중 (오전 10시쯤 채워져요)" : "") : `
      <details>
        <summary>📝 영상 내용 · 댓글안 ${n.comments.length}개</summary>
        <div class="in">
          ${n.summary ? `<div><div class="lbl">요약</div><div class="txt">${esc(n.summary)}</div></div>` : ""}
          ${n.flow ? `<div><div class="lbl">흐름</div><div class="txt">${esc(n.flow)}</div></div>` : ""}
          ${n.comments.map((c, i) => `<div class="cmt">
            <div class="cmt-head"><span class="lbl">댓글안 ${i + 1}</span><button class="btn small" data-copy="${i}">복사</button></div>
            <div data-cmt="${i}">${cmtHtml(el.dataset.ytc, i, c)}</div></div>`).join("")}
        </div>
      </details>`;
  });
}
$("groups").addEventListener("click", e => {
  const o = e.target.closest("[data-pick]");
  if (o) {
    const vid = o.closest("[data-ytc]").dataset.ytc;
    const [i, g, k] = o.dataset.pick.split(":").map(Number);
    (cmtPicks[vid + ":" + i] ||= {})[g] = k;
    o.closest("[data-cmt]").innerHTML = cmtHtml(vid, i, ytNotes[vid].comments[i]);
    return;
  }
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const vid = b.closest("[data-ytc]").dataset.ytc;
  navigator.clipboard.writeText(cmtText(vid, +b.dataset.copy, ytNotes[vid].comments[+b.dataset.copy])).then(() => {
    b.textContent = "복사됨 ✓"; setTimeout(() => b.textContent = "복사", 1500);
  }, () => showNotice("복사하지 못했어요. 글을 길게 눌러 직접 복사해 주세요."));
});

// 지식인 / 스레드: 사람별 할당량 + 1건씩 체크하는 칸 (체크하면 시각 표시)
function renderUnits() {
  const mgr = role === "manager";
  for (const cat of ["kin", "threads"]) {
    $("units-" + cat).innerHTML = visiblePeople().map(p => {
      const n = quotas[cat][p] || 0;
      const keys = Array.from({length: n}, (_, i) => `${cat}:${p}:${i + 1}`);
      const doneN = keys.filter(isDone).length;
      const control = mgr && ONLINE
        ? `<span class="stepper"><button data-quota="${cat}:${p}:-1" aria-label="줄이기">−</button><span>${n}건</span><button data-quota="${cat}:${p}:1" aria-label="늘리기">+</button></span>`
        : `<span class="sub">할당 ${n}건</span>`;
      const chips = keys.map((k, i) => {
        const done = isDone(k);
        return `<button class="chip ${p}${done ? " done" : ""}" data-unit="${k}" ${ONLINE && !canCheck(k) ? "disabled" : ""}
          title="${done ? "완료 " + hm(T(items[k]?.doneAt)) + " · 다시 누르면 취소" : "완료하면 누르기"}">${done ? "✓ " + hm(T(items[k]?.doneAt)) : "#" + (i + 1)}</button>`;
      }).join("");
      return `<div class="unit-row"><div class="uhead"><span class="pdot ${p}"></span><b>${esc(NAMES[p])}</b>${control}<span class="cnt">${doneN} / ${n}</span></div>
        ${n ? `<div class="chips">${chips}</div>` : `<div class="empty">할당 없음</div>`}</div>`;
    }).join("");
    const all = ITEMS.filter(i => i.cat === cat && visiblePeople().includes(i.owner));
    $(cat === "kin" ? "t-kin" : "t-th").style.opacity = all.length && all.every(i => isDone(i.key)) ? .7 : "";
  }
}

      <div class="pct">${s.pct == null ? "—" : s.pct + "%"}<small>${s.pct == null ? "할당 없음" : `${s.done} / ${s.assigned}건`}</small></div>
      ${rows || `<div class="empty">오늘 할당된 과업이 없어요.</div>`}
      <div class="worktime">
        <span>시작 <b>${hm(tl.start)}</b>${tl.start ? "" : (tl.first ? ` (첫 완료 ${hm(tl.first)})` : "")}</span>

  }).join("");
}

// 누적 완료 건수: 사람별 계단선 (색 = 사람, 끝에 이름 직접 표시, 마우스 올리면 시각별 건수)
function renderCumChart() {
  const ppl = visiblePeople();
  const series = ppl.map(p => ({p, tl: timeline(p), total: personStats(p).assigned}));
  $("cum-legend").innerHTML = ppl.length > 1 ? ppl.map(p => `<span><span class="pdot ${p}"></span>${esc(NAMES[p])}</span>`).join("") : "";
  const day0 = new Date(DATA.date + "T00:00:00").getTime();
  const firsts = series.map(s => s.tl.first).filter(Boolean);
  const lasts = series.map(s => s.tl.last).filter(Boolean);
  if (!firsts.length) { $("cum-chart").innerHTML = `<div class="empty">아직 완료한 과업이 없어요. 체크하면 여기에 시간대별로 쌓여요.</div>`; return; }
  const H = 3600e3, now = Math.min(Date.now(), day0 + 24 * H - 1);
  const x0 = Math.min(Math.floor(Math.min(...firsts) / H) * H, day0 + 9 * H);
  const x1 = Math.max(Math.ceil(Math.max(now, ...lasts) / H) * H, x0 + 2 * H);
  const yMax = Math.max(1, ...series.map(s => Math.max(s.total, s.tl.events.length)));
  const W = 760, Ht = 220, m = {l: 30, r: 64, t: 12, b: 24};
  const X = t => m.l + (t - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = v => Ht - m.b - v / yMax * (Ht - m.t - m.b);
  const ticks = [0, Math.round(yMax / 2), yMax].filter((v, i, a) => a.indexOf(v) === i);
  const hours = [];
  const stepH = (x1 - x0) / H > 8 ? 2 : 1;
  for (let t = x0; t <= x1; t += stepH * H) hours.push(t);
  const paths = series.map(s => {
    const start = s.tl.first;
    let dStr = `M${X(start)},${Y(0)}`, c = 0;
    for (const e of s.tl.events) { dStr += `H${X(e.t)}V${Y(++c)}`; }
    dStr += `H${X(Math.max(now, s.tl.last || start))}`;
    const endX = X(Math.max(now, s.tl.last || start));
    return `<path d="${dStr}" fill="none" stroke="var(--p-${s.p})" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="${endX}" cy="${Y(c)}" r="4" fill="var(--p-${s.p})" stroke="var(--card)" stroke-width="2"/>
      <text class="lbl" x="${endX + 8}" y="${Y(c) + 4}">${esc(NAMES[s.p])} ${c}</text>`;
  }).join("");
  $("cum-chart").innerHTML = `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="오늘 누적 완료 건수">
    ${ticks.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
    ${hours.map(t => `<text x="${X(t)}" y="${Ht - 6}" text-anchor="middle">${new Date(t).getHours()}시</text>`).join("")}
    ${paths}
    <line id="cum-x" y1="${m.t}" y2="${Ht - m.b}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/>
    <rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${Ht}" fill="transparent" id="cum-hit"/>
  </svg>`;
  const svg = $("cum-chart").querySelector("svg"), tip = $("cum-tip"), cross = $("cum-x");
  const move = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    const t = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    if (t < x0 || t > x1) return;
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("opacity", 1);
    tip.innerHTML = `<b>${hm(t)}</b><br>` + series.map(s => `${esc(NAMES[s.p])} ${s.tl.events.filter(e => e.t <= t).length}건`).join("<br>");
    const box = $("cum-box").getBoundingClientRect();
    tip.style.left = Math.min(ev.clientX - box.left + 12, box.width - 110) + "px";
    tip.style.top = (ev.clientY - box.top - 10) + "px";
    tip.classList.add("on");
  };
  const hit = $("cum-hit");
  hit.onpointermove = move;
  hit.onpointerleave = () => { tip.classList.remove("on"); cross.setAttribute("opacity", 0); };
}

function renderTimeline() {
  const ev = visiblePeople().flatMap(p => timeline(p).events).sort((a, b) => b.t - a.t).slice(0, 60);
  const starts = visiblePeople().map(p => ({p, t: timeline(p).start})).filter(s => s.t);
  const rows = [...ev.map(e => ({t: e.t, p: e.p, task: e.cat === "yt" ? `유튜브 · ${e.label}` : e.label, d: e.brk ? "휴식 후" : dur(e.dur)})),
    ...starts.map(s => ({t: s.t, p: s.p, task: "업무 시작", d: ""}))].sort((a, b) => b.t - a.t);
  $("timeline").innerHTML = rows.length
    ? `<tr><th>시각</th><th>담당</th><th>과업</th><th>소요</th></tr>` + rows.map(r => `<tr>
        <td class="t">${hm(r.t)}</td><td><span class="pdot ${r.p}"></span>${esc(NAMES[r.p])}</td>
        <td class="tk" title="${esc(r.task)}">${esc(r.task)}</td><td class="t">${esc(r.d)}</td></tr>`).join("")
    : `<tr><td class="empty">"업무 시작"을 누르고 과업을 하나씩 체크하면 시각과 소요시간이 기록돼요.</td></tr>`;
}

document.addEventListener("click", e => {

  const add = e.target.closest("[data-note-add]");

    const cat = add.dataset.noteAdd, input = $("nf-text-" + cat), text = input.value.trim();

document.addEventListener("keydown", e => {

function renderLog() {
  const el = $("log-body");
  if (!ONLINE) { el.className = "empty"; el.textContent = "기록은 접근 링크로 열었을 때 구글 시트에 저장돼요."; return; }
  if (!role) return;
  const mgr = role === "manager";

  if (mgr && !$("fb-text")) {
    $("fb-area").innerHTML = `<div class="fb-form"><textarea id="fb-text" placeholder="${esc(NAMES.member)}님에게 오늘 수행에 대한 짧은 피드백"></textarea>
      <button class="btn primary" id="fb-send">보내기</button></div>`;
    $("fb-send").onclick = () => {
      const text = $("fb-text").value.trim();
      if (!text) return;
      feedback.push({date: DATA.date, to: "member", text});
      $("fb-text").value = "";
      render();
      post({action: "feedback", to: "member", text});
    };
  }

  // 날짜별로 묶기 (오늘은 화면 상태 기준)
  const byDay = {};
  logRows.forEach(r => { (byDay[r.date] ||= {})[r.person] = r; });
  byDay[DATA.date] = Object.fromEntries(summaries().map(s => [s.person, s]));
  const fbByDay = {};
  feedback.forEach(f => (fbByDay[f.date] ||= []).push(f));
  Object.keys(fbByDay).forEach(k => byDay[k] ||= {});
  const days = Object.keys(byDay).sort().reverse().slice(0, 30);
  const people = visiblePeople();
  const num = v => typeof v === "number" ? v : null;
  const avg = (p, n) => {
    const v = days.slice(0, n).map(k => num(byDay[k][p]?.pct)).filter(x => x != null);
    return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) + "%" : "-";
  };
  const avgWork = p => {
    const v = days.slice(0, 7).map(k => byDay[k][p]).filter(r => num(r?.workMin) != null && r.done);
    const mins = v.reduce((a, r) => a + r.workMin, 0), cnt = v.reduce((a, r) => a + r.done, 0);
    return cnt ? dur(mins / cnt * 60000) : "-";
  };
  const cell = r => num(r?.pct) != null
    ? `<b>${r.pct}%</b> <span class="sub">(${r.done}/${r.assigned})</span>`
    : `<span class="sub">할당 없음</span>`;
  const timeCell = r => num(r?.pct) != null && r.start
    ? `${hm(T(r.start))}~${hm(T(r.end))}<br><span class="sub">순작업 ${dur(num(r.workMin) == null ? null : r.workMin * 60000)}</span>` : `<span class="sub">—</span>`;

  el.className = "";
  el.innerHTML = `
    <div class="stats">${people.map(p => `
      <div class="stat"><b>${avg(p, 7)}</b><span><span class="pdot ${p}"></span>${esc(NAMES[p])} 7일 평균 수행율</span></div>
      <div class="stat"><b>${avgWork(p)}</b><span><span class="pdot ${p}"></span>${esc(NAMES[p])} 7일 건당 평균 시간</span></div>`).join("")}
    </div>
    <div class="chartbox chart" id="trend-box">
      <h3>최근 14일 수행율</h3>
      <div class="legend">${people.length > 1 ? people.map(p => `<span><span class="pdot ${p}"></span>${esc(NAMES[p])}</span>`).join("") : ""}</div>
      <div id="trend-chart"></div>
      <div class="tip" id="trend-tip"></div>
    </div>
    <div class="tablewrap"><table class="logtable">
      <tr><th>날짜</th>${people.map(p => `<th>${esc(NAMES[p])} 수행율</th><th>${esc(NAMES[p])} 근무시간</th>`).join("")}<th>${esc(NAMES.member)} 피드백</th></tr>
      ${days.map(k => `<tr>
        <td><button class="daybtn${k === detailDay ? " on" : ""}" data-day-detail="${k}">${dayLabel(k)}${k === DATA.date ? " · 오늘" : ""} ▸</button></td>
        ${people.map(p => `<td>${cell(byDay[k][p])}</td><td>${timeCell(byDay[k][p])}</td>`).join("")}
        <td class="fbcell">${(fbByDay[k] || []).map(f => `<div>${esc(f.text)}</div>`).join("") || `<span class="sub">—</span>`}</td>
      </tr>`).join("")}
    </table></div>
    <div id="day-detail"></div>`;
  renderTrend(byDay, people);
  renderDayDetail();
}

// 날짜를 누르면 그날 과업별 소요시간 (오늘은 화면 상태, 지난 날은 시트 worklog 에서 불러옴)
let detailDay = null, detailRows = null;
const detailCache = {};
function liveWorklog() {
  return worklogRows().filter(r => visiblePeople().includes(r.person));
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-day-detail]");
  if (!b) return;
  const k = b.dataset.dayDetail;
  if (detailDay === k) { detailDay = null; renderLog(); return; }
  detailDay = k;
  detailRows = k === DATA.date ? null : detailCache[k] || "loading";
  renderLog();
  if (k !== DATA.date && !detailCache[k]) {
    fetch(`${DATA.api_url}?k=${encodeURIComponent(ACCESS)}&date=${k}`).then(r => r.json()).then(res => {
      detailCache[k] = res.worklog || [];
      if (detailDay === k) { detailRows = detailCache[k]; renderLog(); }
    }).catch(() => { if (detailDay === k) { detailRows = []; renderLog(); } });
  }
});
function renderDayDetail() {
  const el = $("day-detail");
  if (!el) return;
  if (!detailDay) { el.innerHTML = ""; return; }
  const rows = detailDay === DATA.date ? liveWorklog() : detailRows;
  if (rows === "loading") { el.innerHTML = `<div class="empty">${dayLabel(detailDay)} 기록을 불러오는 중…</div>`; return; }
  const done = rows.filter(r => r.cat !== "start");
  const byCat = Object.keys(CATS).map(c => {
    const v = done.filter(r => r.cat === c && typeof r.min === "number");
    return v.length ? `${CATS[c]} 건당 ${dur(v.reduce((a, r) => a + r.min, 0) / v.length * 60000)}` : "";
  }).filter(Boolean).join(" · ");
  el.innerHTML = `<div class="detail-head"><h3>${dayLabel(detailDay)} 과업별 소요시간</h3><span>${done.length}건 완료${byCat ? " · " + byCat : ""}</span></div>
    ${rows.length ? `<div class="timeline-wrap"><table class="timeline">
      <tr><th>담당</th><th>과업</th><th>시작</th><th>완료</th><th>소요</th><th>비고</th></tr>
      ${rows.slice().sort((a, b) => T(a.at) - T(b.at)).map(r => `<tr>
        <td><span class="pdot ${r.person}"></span>${esc(NAMES[r.person] || r.person)}</td>
        <td class="tk" title="${esc(r.label)}">${r.cat === "yt" ? "유튜브 · " : ""}${esc(r.label)}</td>
        <td class="t">${hm(T(r.from))}</td><td class="t">${hm(T(r.at))}</td>
        <td class="t">${typeof r.min === "number" ? dur(r.min * 60000) : "—"}</td>
        <td class="sub">${esc(r.note || "")}</td></tr>`).join("")}
    </table></div>` : `<div class="empty">이날 기록된 과업이 없어요.</div>`}`;
}

// 최근 14일 수행율: 날짜별 막대 (사람별 나란히, 2px 간격, 윗끝 둥글게)
function renderTrend(byDay, people) {
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const t = new Date(DATA.date + "T00:00:00"); t.setDate(t.getDate() - i);
    days.push(`${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`);
  }
  const W = 760, Ht = 180, m = {l: 34, r: 8, t: 10, b: 24};
  const slot = (W - m.l - m.r) / days.length, gap = 2;
  const bw = Math.min(18, (slot * .7 - gap * (people.length - 1)) / people.length);
  const Y = v => Ht - m.b - v / 100 * (Ht - m.t - m.b);
  const bar = (x, v, p, k) => {
    const y = Y(v), h = Ht - m.b - y, r = Math.min(4, h, bw / 2);
    const dPath = h <= 0 ? "" : `M${x},${Ht - m.b}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${Ht - m.b}Z`;
    return dPath ? `<path d="${dPath}" fill="var(--p-${p})"/>` : "";
  };
  let marks = "", hits = "";
  days.forEach((k, i) => {
    const cx = m.l + slot * i + slot / 2, x = cx - (bw * people.length + gap * (people.length - 1)) / 2;
    people.forEach((p, j) => {
      const r = byDay[k]?.[p], v = typeof r?.pct === "number" ? r.pct : null;
      if (v != null) marks += bar(x + j * (bw + gap), v, p, k);
    });
    hits += `<rect x="${m.l + slot * i}" y="0" width="${slot}" height="${Ht}" fill="transparent" data-day="${k}"/>`;
  });
  $("trend-chart").innerHTML = `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="최근 14일 수행율">
    ${[0, 50, 100].map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${v}%</text>`).join("")}
    ${days.map((k, i) => i % 2 === (days.length - 1) % 2 ? `<text x="${m.l + slot * i + slot / 2}" y="${Ht - 6}" text-anchor="middle">${+k.slice(5, 7)}/${+k.slice(8)}</text>` : "").join("")}
    ${marks}${hits}</svg>`;
  const tip = $("trend-tip"), box = $("trend-box");
  $("trend-chart").querySelectorAll("[data-day]").forEach(h => {
    h.onpointermove = ev => {
      const k = h.dataset.day;
      tip.innerHTML = `<b>${dayLabel(k)}</b><br>` + people.map(p => {
        const r = byDay[k]?.[p];
        return `${esc(NAMES[p])} ${typeof r?.pct === "number" ? `${r.pct}% (${r.done}/${r.assigned})` : "기록 없음"}`;
      }).join("<br>");
      const b = box.getBoundingClientRect();
      tip.style.left = Math.min(ev.clientX - b.left + 12, b.width - 150) + "px";
      tip.style.top = (ev.clientY - b.top - 10) + "px";
      tip.classList.add("on");
    };
    h.onpointerleave = () => tip.classList.remove("on");
  });
}

// ── 시작
if (ONLINE) {
  render();
  poll();
  setInterval(poll, 30000);
  setInterval(() => { if (!pending) render(); }, 60000);  // 경과 시간 · 그래프 끝점 갱신
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
} else {
  try { const saved = JSON.parse(store.get("local-" + DATA.date) || "{}"); items = saved.items || {}; if (saved.quotas) quotas = saved.quotas; } catch (e) {}
  buildItems();
  render();
}
</script>
</body>
</html>
